title: LSASS Memory Dump via Comsvcs DLL MiniDump
id: b128f731-2943-4dc9-9832-72314ad31056
status: test
description: Detects the dumping of LSASS memory using rundll32.exe calling comsvcs.dll MiniDump export to harvest plaintext credentials and NTLM hashes.
references:
    - https://attack.mitre.org/techniques/T1003/001/
author: Bassma Alaoui Sossey
date: 2026-11-20
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\rundll32.exe'
        CommandLine|contains:
            - 'comsvcs.dll'
            - 'comsvcs'
        CommandLine|contains|all:
            - 'MiniDump'
    condition: selection
falsepositives:
    - Highly anomalous; unexpected in benign enterprise activity.
level: critical
tags:
    - attack.credential_access
    - attack.t1003.001
