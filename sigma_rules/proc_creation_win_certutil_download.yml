title: Suspicious Certutil Download Utility Execution
id: 6d41c912-3b88-4e64-9a4a-55d204b8e201
status: test
description: Detects certutil.exe invoked with urlcache or split flags to fetch remote payloads onto Windows endpoints.
references:
    - https://attack.mitre.org/techniques/T1105/
author: Bassma Alaoui Sossey
date: 2026-11-26
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\certutil.exe'
    selection_cli:
        CommandLine|contains:
            - 'urlcache'
            - 'verifyctl'
    condition: selection_img and selection_cli
falsepositives:
    - Occasional certificate store troubleshooting by PKI administrators.
level: high
tags:
    - attack.command_and_control
    - attack.t1105
