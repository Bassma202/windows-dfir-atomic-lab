name: VESPER DFIR & Detection Engineering CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-pysigma-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install VESPER dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check src tests scripts

      - name: Static security scan with Bandit
        run: bandit -r src -q --severity-level high

      - name: Run pySigma, EVTX, and regression tests
        run: pytest -v --cov=src/vesper

  windows-powershell-triage-verify:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate PowerShell AST syntax
        shell: pwsh
        run: |
          $scripts = @("triage_collector/collect_triage.ps1", "adversary_emulation/atomic_tests.ps1")
          foreach ($s in $scripts) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $s), [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell syntax error in ${s}: $($errors | Out-String)"
            }
            Write-Host "Syntax OK: $s"
          }

      - name: Execute live Windows triage collector and verify SHA-256 manifest
        shell: powershell
        run: |
          $out = .\triage_collector\collect_triage.ps1 -OutputDir "$env:RUNNER_TEMP\vesper_ci_triage"
          Write-Host $out
          $manifestFile = ($out | Where-Object { $_ -like "VESPER_TRIAGE_COMPLETE:*" }) -replace "VESPER_TRIAGE_COMPLETE:", ""
          if (-not (Test-Path $manifestFile)) { throw "Manifest not created" }
          $m = Get-Content $manifestFile -Raw | ConvertFrom-Json
          if ($m.artifacts.Count -lt 2) { throw "Expected at least 2 collected triage artifacts" }
          Write-Host "Verified $($m.artifacts.Count) SHA-256 hashed Windows artifacts on $($m.os_version)"

      - name: Execute safe benign emulation harness and parse live Windows EVTX
        shell: powershell
        run: |
          $out = .\adversary_emulation\atomic_tests.ps1 -LogOutputDir "$env:RUNNER_TEMP\vesper_ci_emu" -ExecuteBenignDiscovery
          Write-Host $out
          $repFile = ($out | Where-Object { $_ -like "VESPER_EMULATION_COMPLETE:*" }) -replace "VESPER_EMULATION_COMPLETE:", ""
          $rep = Get-Content $repFile -Raw | ConvertFrom-Json
          if (-not $rep.executed_benign_verified) { throw "Benign encoded discovery check failed" }
          if (-not $rep.cleanup_verified) { throw "Cleanup verification flag false" }
          Write-Host "Verified benign PowerShell execution on Windows runner"
